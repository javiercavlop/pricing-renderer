version: 2
updates:
  - package-ecosystem: npm
    # Day-to-day work lands on develop and main only receives release merges, so an update
    # computed against main is already stale when it opens.
    target-branch: develop
    directories:
      - /
      - /examples/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns:
          - '*'
      framework-tooling:
        applies-to: version-updates
        patterns:
          - next
          - vite
          - vite-*
          - '@vitejs/*'
          - vitest
          - '@vitest/*'
      development:
        applies-to: version-updates
        dependency-type: development
  - package-ecosystem: github-actions
    target-branch: develop
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - '*'
      actions:
        applies-to: version-updates
        patterns:
          - '*'
