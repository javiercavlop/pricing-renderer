# TEMPORARY workflow. It is never merged: the lead removes it from the branch
# before the pull request is marked ready.
#
# It generates the Linux Chromium baselines for
# tests/browser/visual-variants.spec.ts on the CI runner, as was done for the
# existing -linux baselines, and commits them back to the branch.
name: Visual baselines (one-off)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/visual-baselines-dark-rtl
    paths:
      - .github/workflows/visual-baselines-once.yml
      - tests/browser/visual-variants.spec.ts

permissions:
  contents: write

concurrency:
  group: visual-baselines-once-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.19.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # An assertion failure (for example an RTL overflow) is a finding and the
      # assertion is not loosened. The step must not stop the job, so the PNGs,
      # the log and the report stay available; the last step fails the job.
      - name: Generate baselines
        id: playwright
        continue-on-error: true
        run: pnpm exec playwright test tests/browser/visual-variants.spec.ts --project=chromium --update-snapshots --reporter=list,html
      - name: Commit baselines
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add tests/browser/visual-variants.spec.ts-snapshots
          git status --short
          ls -la tests/browser/visual-variants.spec.ts-snapshots || true
          if git diff --cached --quiet; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: add dark and RTL linux visual baselines (CI one-off)'
          git push origin "HEAD:${BRANCH}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: visual-baselines-once
          path: |
            tests/browser/visual-variants.spec.ts-snapshots/
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
          overwrite: true
      - name: Fail on test failure
        if: steps.playwright.outcome == 'failure'
        run: |
          echo "The Playwright step failed; see the log and the report artifact."
          exit 1
