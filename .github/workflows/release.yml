name: Publish npm package

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to deploy
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish-${{ github.repository }}-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # NOTE: this single job holds id-token: write (needed for npm provenance
    # and OIDC publishing) and also installs dependencies and runs the full
    # test suite from the release tag. Third-party install scripts and test
    # code therefore execute in a job that can mint an OIDC token. This is
    # accepted deliberately so that the exact commit that is tested is the
    # one that is published, and the job is gated by the protected "npm"
    # environment and the immutable release tag. Splitting it into an
    # unprivileged verify job and a minimal publish job would reduce the
    # exposure but changes the release flow and has not been approved.
    # The npm CLI is the one bundled with the Node that setup-node installs,
    # checked against a minimum version below; no npm is installed globally.
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      # [impl->req~release-dist-tag-prerelease-map~1]
      - name: Verify the published GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName)"

          if [ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]; then
            echo "::error::The GitHub Release must be published before npm deployment."
            exit 1
          fi

          if [ "$(jq -r '.tagName' <<<"$release_json")" != "$RELEASE_TAG" ]; then
            echo "::error::The published GitHub Release tag does not match $RELEASE_TAG."
            exit 1
          fi

          is_prerelease="$(jq -r '.isPrerelease' <<<"$release_json")"
          case "$is_prerelease" in
            true) dist_tag=next ;;
            false) dist_tag=latest ;;
            *)
              echo "::error::Unexpected isPrerelease value in the GitHub Release: $is_prerelease"
              exit 1
              ;;
          esac
          echo "dist_tag=$dist_tag" >>"$GITHUB_OUTPUT"

      - name: Check out the immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10.19.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm trusted publishing (OIDC) needs npm >= 11.5.1. The npm CLI comes
      # bundled with the Node distribution that setup-node installs; nothing
      # else is downloaded here. Fail closed if the bundled npm is too old.
      - name: Require an OIDC-capable npm CLI
        env:
          NPM_MIN_VERSION: 11.5.1
        run: |
          npm_version="$(npm --version)"
          if ! NPM_VERSION="$npm_version" node -e '
            const parse = (v) => v.split("-")[0].split(".").map(Number);
            const have = parse(process.env.NPM_VERSION);
            const need = parse(process.env.NPM_MIN_VERSION);
            for (let i = 0; i < 3; i++) {
              if ((have[i] || 0) !== (need[i] || 0)) {
                process.exit((have[i] || 0) > (need[i] || 0) ? 0 : 1);
              }
            }
          '; then
            echo "::error::npm $npm_version is older than $NPM_MIN_VERSION, which npm trusted publishing requires."
            exit 1
          fi
          echo "npm $npm_version satisfies >= $NPM_MIN_VERSION"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata and documentation
        run: pnpm release:check -- "$RELEASE_TAG"

      - name: Verify that the npm version is not already published
        run: pnpm release:registry-check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # [impl->req~release-single-unit-test-run~1]
      - name: Run unit tests
        run: pnpm test

      - name: Validate the packed library
        run: pnpm package:check

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser, accessibility, and visual tests
        run: pnpm test:browser

      - name: Upload browser diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # [impl->req~release-dist-tag-env~1]
      # [impl->req~release-check-substrings-kept~1]
      - name: Publish stable releases to latest and prereleases to next
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: |
          case "$DIST_TAG" in
            latest|next) ;;
            *)
              echo "::error::Unexpected npm dist-tag: $DIST_TAG"
              exit 1
              ;;
          esac
          npm publish --access public --provenance --tag "$DIST_TAG"
