name: Publish npm package

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      NPM_DIST_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
    steps:
      - name: Check out the immutable release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.19.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an OIDC-compatible npm CLI
        run: npm install --global npm@11.18.0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata and documentation
        run: pnpm release:check -- "$RELEASE_TAG"

      - name: Verify that the npm version is not already published
        run: pnpm release:registry-check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Validate the packed library
        run: pnpm package:check

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser, accessibility, and visual tests
        run: pnpm test:browser

      - name: Upload browser diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-playwright-report-${{ github.event.release.tag_name }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish stable releases to latest and prereleases to next
        run: npm publish --access public --provenance --tag "$NPM_DIST_TAG"
        env:
          # Only set this repository/environment secret for the one-time first publication.
          # Remove it after configuring npm Trusted Publishing for release.yml.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
