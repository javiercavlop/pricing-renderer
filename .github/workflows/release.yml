name: Publish npm package

on:
  release:
    types:
      - published
  workflow_call:
    inputs:
      release_tag:
        description: Existing published GitHub Release tag to deploy
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-publish-${{ github.repository }}-${{ inputs.release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    # NOTE: this single job holds id-token: write (needed for npm provenance
    # and OIDC publishing) and also installs dependencies and runs the full
    # test suite from the release tag. Third-party install scripts and test
    # code therefore execute in a job that can mint an OIDC token. This is
    # accepted deliberately so that the exact commit that is tested is the
    # one that is published, and the job is gated by the protected "npm"
    # environment and the immutable release tag. Splitting it into an
    # unprivileged verify job and a minimal publish job would reduce the
    # exposure but changes the release flow and has not been approved.
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
    steps:
      - name: Verify the published GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName)"

          if [ "$(jq -r '.isDraft' <<<"$release_json")" != "false" ]; then
            echo "::error::The GitHub Release must be published before npm deployment."
            exit 1
          fi

          if [ "$(jq -r '.tagName' <<<"$release_json")" != "$RELEASE_TAG" ]; then
            echo "::error::The published GitHub Release tag does not match $RELEASE_TAG."
            exit 1
          fi

          if [ "$(jq -r '.isPrerelease' <<<"$release_json")" = "true" ]; then
            echo "dist_tag=next" >>"$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >>"$GITHUB_OUTPUT"
          fi

      - name: Check out the immutable release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.19.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Risk: the npm CLI is pinned to an exact version but downloaded without
      # an integrity or signature check beyond what the registry and npm's own
      # install provide, and it runs before dependencies are installed in the
      # job that holds id-token: write. A compromised npm@11.18.0 tarball or
      # registry response could act on the publish. Mitigations to consider
      # separately: verify the tarball integrity hash or registry signatures
      # (npm audit signatures), or use a runner image that already ships an
      # OIDC-capable npm.
      - name: Use an OIDC-compatible npm CLI
        run: npm install --global npm@11.18.0

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release metadata and documentation
        run: pnpm release:check -- "$RELEASE_TAG"

      - name: Verify that the npm version is not already published
        run: pnpm release:registry-check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Validate the packed library
        run: pnpm package:check

      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser, accessibility, and visual tests
        run: pnpm test:browser

      - name: Upload browser diagnostics after a failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish stable releases to latest and prereleases to next
        run: npm publish --access public --provenance --tag "${{ steps.release.outputs.dist_tag }}"
