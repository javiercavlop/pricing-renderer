name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    # Intentionally fail closed until the maintainer has approved the live demo
    # and explicitly sets this repository variable to "true".
    if: vars.NPM_PUBLICATION_APPROVED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package:check
      - run: pnpm release:check -- "${{ github.ref_name }}"
      - run: npm publish --access public --provenance
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
