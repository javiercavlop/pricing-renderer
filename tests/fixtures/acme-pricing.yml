syntaxVersion: '3.1'
saasName: Acme Cloud
version: '2026.07'
createdAt: '2026-07-29'
url: https://example.com/pricing
tags:
  - SaaS
  - Developer tools
currency: EUR
billing:
  monthly: 1
  yearly: 0.8
variables:
  seats: 5
  prioritySupport: false
  region: eu
  priceByRegion:
    eu-price: 8
    us-price: 10
features:
  projects:
    description: Active projects in the workspace.
    tag: Workspace
    valueType: BOOLEAN
    defaultValue: false
    docUrl: https://example.com/docs/projects
  collaboration:
    description: Invite teammates and work together.
    tag: Workspace
    valueType: BOOLEAN
    defaultValue: false
  auditLog:
    description: Searchable security audit history.
    tag: Security
    valueType: BOOLEAN
    defaultValue: false
  customRoles:
    description: Fine-grained access control.
    tag: Security
    valueType: BOOLEAN
    defaultValue: false
usageLimits:
  storage:
    description: Included managed storage.
    tag: Usage
    type: renewable
    period: monthly
    trackable: true
    valueType: NUMERIC
    defaultValue: 5
    unit: GB
plans:
  starter:
    description: For small teams getting started.
    price: '4 * #seats'
    unit: month
    features:
      projects:
        value: true
      collaboration:
        value: true
    usageLimits:
      storage:
        value: 10
  growth:
    description: Advanced controls for growing companies.
    price: '#prioritySupport ? 12 * #seats : 9 * #seats'
    unit: month
    features:
      projects:
        value: true
      collaboration:
        value: true
      auditLog:
        value: true
    usageLimits:
      storage:
        value: 100
  enterprise:
    description: Scale, governance and dedicated support.
    price: "#priceByRegion[#region.concat('-price')] * #seats"
    unit: month
    features:
      projects:
        value: true
      collaboration:
        value: true
      auditLog:
        value: true
      customRoles:
        value: true
    usageLimits:
      storage:
        value: .inf
addOns:
  extraStorage:
    description: Additional managed storage packs.
    availableFor:
      - growth
      - enterprise
    price: 5
    unit: pack/month
    usageLimitsExtensions:
      storage:
        value: 50
    subscriptionConstraints:
      minQuantity: 1
      maxQuantity: 10
      quantityStep: 1
  compliance:
    description: Compliance reports and evidence collection.
    availableFor:
      - enterprise
    price: Contact sales
    unit: month
    features:
      auditLog:
        value: true
  prioritySuccess:
    description: A named technical success manager.
    availableFor:
      - growth
      - enterprise
    dependsOn:
      - extraStorage
    excludes:
      - compliance
    price: 'Math.floor(#seats / 5) < 1 ? 25 : Math.floor(#seats / 5) * 25'
    unit: month
custom:
  pricingRenderer:
    title: Simple pricing that scales with you
    subtitle: Configure seats and add-ons to see an estimate instantly.
    planInheritance: auto
    planBadges:
      growth:
        - id: most-popular
          label: Most popular
          tone: accent
          emphasize: true
      enterprise:
        - id: scale
          label: Built for scale
          tone: neutral
    planHighlights:
      starter:
        mode: manual
        items:
          - id: projects
            kind: feature
          - id: collaboration
            kind: feature
      growth:
        mode: hybrid
        items:
          - id: auditLog
            kind: feature
          - id: storage
            kind: usage-limit
      enterprise:
        mode: hybrid
        items:
          - id: customRoles
            kind: feature
          - id: storage
            kind: usage-limit
    variableControls:
      - path: seats
        type: slider
        label: Team seats
        min: 1
        max: 250
        step: 1
      - path: prioritySupport
        type: boolean
        label: Priority support
      - path: region
        type: select
        label: Billing region
        options:
          - value: eu
            label: Europe
          - value: us
            label: United States
    billingLabels:
      monthly: Monthly
      yearly: Yearly
    ctas:
      - id: start-starter
        label: Start with Starter
        planId: starter
      - id: start-growth
        label: Start free trial
        planId: growth
        href: https://example.com/signup?plan=growth
      - id: contact-enterprise
        label: Contact sales
        planId: enterprise
        href: https://example.com/contact
